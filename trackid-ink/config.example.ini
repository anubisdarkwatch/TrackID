# TrackID Ink config. Edit, then: sudo systemctl restart trackid-ink

[trackid]
# Where TrackID is. If trackid.local doesn't resolve on your network, use its IP
# (shown at the bottom of the Whisplay screen), e.g. http://192.168.1.42:8080
url = http://trackid.local:8080
# Seconds between checks
poll = 2

[display]
# Which e-paper: waveshare_v4 (Waveshare 2.13" e-Paper HAT V4) or adafruit (Adafruit 2.13" Mono E-Ink Bonnet #4687)
panel = waveshare_v4
# Adafruit only. Newer bonnets: ssd1680b. If the picture is shifted, garbled or blank, try ssd1680,
# then ssd1680_legacy, then ssd1675b (the oldest bonnets).
adafruit_driver = ssd1680b
# Redraw the BPM only when it moves by at least this much...
bpm_step = 1
# ...and at most once every N seconds (e-paper flickers a little on each update; Adafruit: at least 20)
bpm_min_gap = 6
# Waveshare only: full clean refresh (the black-white flash) after this many quick updates, or every N minutes
full_refresh_every = 30
full_refresh_minutes = 15
# Turn the picture upside down (if the HAT sits the other way round)
flip = false
