# TrackID v2.2 config. Edit, then: sudo systemctl restart trackid

[audd]
# Get a token at https://dashboard.audd.io (sign up, copy the API token).
# Left blank, AudD only allows a handful of anonymous requests.
token =
# Store for Spotify links (us, gb, de, ...)
market = us

[capture]
# Seconds of audio sent per ID (5-15). The mic is always recording, so this is "the last N seconds".
seconds = 10
# "auto" finds the Whisplay sound card. Override with an ALSA name if needed.
device = auto
# Digital boost for quiet rooms (1.0 = none). If the level bar sits at the end, lower it.
gain = 1.0

[auto]
# Start in AUTO mode (double tap the button to switch any time)
enabled = false
# What makes AUTO identify:
#   change   = listen for track changes and ID each new track ~15-20 s after it comes in (default).
#              Also IDs at least every max_interval as a safety net. Fewer AudD requests, better start times.
#   interval = the old behaviour: one ID every `interval` seconds while music plays.
trigger = change
# change mode: how different the music has to sound before it counts as a new track.
# Lower = more sensitive (catches smooth blends, but breakdowns may trigger an extra ID). 0.3 - 0.6.
sensitivity = 0.4
# change mode: never ID more often than this (seconds), and always ID at least this often while music plays
min_gap = 60
max_interval = 420
# Hard cap on automatic IDs per hour, whatever the mode (protects your AudD quota)
max_per_hour = 30
# interval mode: seconds between automatic IDs. Each ID is one AudD request:
# 150 s = 24 per hour, about 100 for a 4-hour set.
interval = 150
# Mic level (RMS, 0-1) that counts as "music is playing". Raise it if AUTO fires on room chatter.
min_level = 0.01

[local]
# Your own fingerprint library: tracks here are matched on the Pi, offline, before asking AudD.
# Great for your own productions, edits, bootlegs and promos that AudD has never heard.
enabled = true
# Drop audio files (mp3/wav/flac/aiff/m4a/ogg) in this folder; new files are indexed in the background.
# Tags give artist/title; otherwise the file name ("Artist - Title.mp3").
folder = library
# Index file, inside the data folder
db = library.db
# Match tracks played up to this many percent fast or slow (pitch fader), with or without key lock
speed_range = 8
keylock = true
# How sure a library match must be. Raise it if you ever get a wrong library match.
min_score = 12
# Minutes between checks of the folder for new files (0 = only at startup)
rescan = 10

[export]
# Put tracks that couldn't be identified in the exports, so the timeline stays complete
include_unknown = true
unknown_label = ID - ID

[display]
# Backlight 0-100
brightness = 70
# RGB LED: status colours, and a soft pulse on every beat
led = true
led_beat = true
# Screen refresh rate (4-20)
fps = 12

[web]
# Setlist page at http://<pi-ip>:<port> on your local network
enabled = true
port = 8080
# Allow fixing the setlist from the page (rename, retime, delete, add, listen to and re-ID unknown clips).
# Anyone on the same network can open the page, so set false on networks you don't trust.
edit = true
# Allow other gadgets on the network (TrackID Ink's touch screen) to press the button for you:
# identify now, AUTO on/off. Set false to make TrackID ignore them.
remote = true

[storage]
# Relative paths are inside the trackid folder
data_dir = data
# Keep the audio clips of offline / unknown IDs after they're identified
# (clips of tracks still unknown are always kept so you can listen to them)
keep_clips = false

[conductor]
# Optional: take BPM and beats from the Beat Commander instead of the mic, through a Beat Hub
# (Beat Gateway plugged into this Pi or another one). The mic takes over again whenever the conductor is quiet.
# e.g. url = http://localhost:8090
url =
